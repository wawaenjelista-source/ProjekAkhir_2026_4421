<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TODO HTML-01:
       Lengkapi judul tab browser pada <title> di bawah.
       Kemudian lengkapi judul utama <h1> dan paragraf deskripsi <p>
       di bagian header halaman. -->
  <title>Isi judul halaman</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="kepala-halaman">
      <h1>Isi judul aplikasi</h1>
      <p>Isi deskripsi singkat aplikasi di sini.</p>
    </header>

    <section class="panel" aria-label="Pengelolaan kegiatan">
      <h2>Kelola Kegiatan</h2>

      <!-- TODO HTML-02:
           Lengkapi label, input teks, placeholder, dan ID semua elemen.
           Acuan ID: inputKegiatan, btnTambah, btnCari, btnHapus.
           Gunakan type="button" pada ketiga tombol. -->
      <div class="form-baris">
        <label for="">Nama kegiatan</label>
        <input type="" id="" placeholder="">
      </div>

      <div class="aksi">
        <button type="button" id="">Tambah</button>
        <button type="button" id="">Cari</button>
        <button type="button" id="">Hapus</button>
      </div>
    </section>

    <section class="panel" aria-label="Daftar kegiatan">
      <h2>Daftar Kegiatan</h2>

      <!-- TODO HTML-03:
           Lengkapi ID untuk daftar, jumlah, dan pesan status.
           Acuan ID: daftarKegiatan, totalKegiatan, pesanStatus. -->
      <ol id=""></ol>

      <p class="ringkasan">Jumlah kegiatan: <strong id="">-</strong></p>
      <p id="" aria-live="polite">Status kegiatan akan muncul di sini.</p>
    </section>
  </main>

  <!-- Penghubung JavaScript disediakan guru. Jangan diubah. -->
  <script src="script.js"></script>
</body>
</html>
